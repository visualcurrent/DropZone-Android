// Top-level build file: only pins the two plugin versions used by app/.
// Pairing checked against Chaquopy's version table (17.2 supports Android
// Gradle plugin 7.3 - 9.5 and Python 3.10 - 3.15).
plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.chaquo.python' version '17.2.0' apply false
}
