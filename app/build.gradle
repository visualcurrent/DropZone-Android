plugins {
    id 'com.android.application'
    id 'com.chaquo.python'      // embeds a CPython interpreter + our .py files in the APK
}

// ── Feed from the DropZone project ───────────────────────────────────────────
// The core server is the sibling project's DropZone.py. It is only ever READ
// from there. Every build refreshes our copy when the source has changed, so
// there is never a second, hand-edited DropZone.py to keep in step.
// If the sibling folder is absent (e.g. a fresh clone elsewhere) the committed
// copy is used as-is.
def coreSrc = file('../../DropZone/DropZone.py')
def coreDst = file('src/main/python/DropZone.py')
if (coreSrc.exists() && (!coreDst.exists() || coreSrc.bytes != coreDst.bytes)) {
    coreDst.bytes = coreSrc.bytes
    logger.lifecycle("DropZone.py refreshed from ${coreSrc}")
}

// Read the core's version constant (line: __version__ = "0.2.14") so the APK's
// version name always says which DropZone build is inside it.
def coreMatch = (coreDst.getText('UTF-8') =~ /(?m)^__version__\s*=\s*"([^"]+)"/)
def coreVersion = coreMatch.find() ? coreMatch.group(1) : 'unknown'

// Wrapper's own version (release.beta.incremental, same scheme as DropZone).
def wrapperVersion = '0.1.01'

android {
    namespace 'com.visualcurrent.dropzone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.visualcurrent.dropzone'
        minSdk 26               // Android 8.0
        targetSdk 35
        versionCode 2
        versionName "${wrapperVersion}-dz${coreVersion}"

        // Which CPU types get a Python interpreter in the APK (each adds size).
        // arm64-v8a = every 64-bit phone; x86_64 = the PC emulator.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        // Python inside the APK. Chaquopy also needs the SAME major.minor
        // Python on this PC to pre-compile the .py files; it finds it through
        // the Windows "py" launcher (py -3.13).
        version '3.13'
    }
}
